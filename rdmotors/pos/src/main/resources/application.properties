spring.application.name=rdmotors-pos

# ── Base de datos local ──────────────────────────────────────────────────────
# Corre en la PC de la tienda. Es la FUENTE DE VERDAD del sistema.
spring.datasource.url=jdbc:postgresql://localhost:5433/rdmotors
spring.datasource.username=rdmotors
spring.datasource.password=rdmotors

# ── Esquema ──────────────────────────────────────────────────────────────────
# Flyway manda; Hibernate solo verifica que las entidades cuadren con las tablas.
#
# NO se usa ddl-auto=update (como el car-wash). Su propia skill documenta lo caro que sale:
# no ensancha un CHECK cuando un enum gana un valor, no agrega columnas NOT NULL a tablas
# con filas, y el fallo siempre aparece en la base YA POBLADA — nunca en las pruebas, que
# arrancan vacias. Aqui el esquema se versiona desde la primera tabla.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── Pool de conexiones ───────────────────────────────────────────────────────
# Un solo cajero, una sola PC. No hace falta un pool grande y uno chico deja mas
# memoria libre en un equipo de tienda.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ── Zona horaria ─────────────────────────────────────────────────────────────
spring.jackson.time-zone=America/Bogota

# Accesible desde la tablet y el celular por la red local (no solo desde localhost).
server.address=0.0.0.0
# 8081 y no 8080: el 8080 lo tiene ocupado el backend del car-wash. Cada proyecto su puerto.
server.port=8081

# ── Docker Compose (solo desarrollo) ─────────────────────────────────────────
# 'start_only': levanta el contenedor pero NO lo apaga al detener la app. Reiniciar la
# aplicación treinta veces al día no debería reiniciar Postgres treinta veces.
# El compose.yaml de la raiz define la base. En la tienda esto no aplica: Postgres va nativo.
spring.docker.compose.file=../compose.yaml
spring.docker.compose.lifecycle-management=start_only

# ── Respaldo: la copia que el administrador se lleva (spec 0011) ─────────────
# Hasta el spec 0009 esto sacaba una copia sola, cada madrugada, y la guardaba en
# una carpeta. Al mudarse el sistema a la nube eso dejó de sostenerse: el disco
# del servidor es prestado y se borra en cada reinicio, así que la pantalla habría
# mostrado catorce copias sin que existiera ninguna.
#
# Ahora la copia SE BAJA: el administrador aprieta el botón y el archivo llega a
# su equipo. En el servidor no queda nada, y por eso aquí ya no hay carpeta de
# copias, ni memoria USB, ni días que guardar.
rdmotors.respaldo.dias-sin-bajar-para-avisar=7
# Solo de paso: aquí se saca el archivo mientras viaja al navegador, y se borra en
# cuanto termina. Por defecto, la carpeta temporal del sistema.
#rdmotors.respaldo.carpeta-de-trabajo=
# pg_dump viene con Postgres y tiene que ser de la MISMA VERSIÓN MAYOR del motor.
# En Windows, la ruta completa; dentro del contenedor basta 'pg_dump'.
rdmotors.respaldo.pg-dump=C:/Program Files/PostgreSQL/17/bin/pg_dump.exe

# ── El correo del cierre de caja (spec 0010) ─────────────────────────────────
# Cada cierre deja su resumen por mandar, y una tarea lo manda por la API de
# Brevo cada minuto, reintentando si no hay internet. A quién le llega se
# configura en Ajustes › Correos; sin destinatarios, no se manda nada.
#
# La llave es un SECRETO: va en la variable de entorno BREVO_API_KEY, nunca
# escrita aquí. El remitente tiene que estar verificado en la cuenta de Brevo.
rdmotors.correo.habilitado=true
rdmotors.correo.brevo.api-key=${BREVO_API_KEY:}
rdmotors.correo.remitente=${RDMOTORS_CORREO_REMITENTE:}
rdmotors.correo.remitente-nombre=RD MOTORS
