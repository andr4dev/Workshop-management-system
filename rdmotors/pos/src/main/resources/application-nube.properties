# ═══════════════════════════════════════════════════════════════════════════════
#  Perfil "nube" — lo que cambia cuando el sistema NO corre en el almacén
#  (spec 0011). Se enciende con SPRING_PROFILES_ACTIVE=nube.
# ═══════════════════════════════════════════════════════════════════════════════
#
# Esto NO reemplaza a application.properties: se suma encima y solo cambia lo que
# tiene que cambiar. Por eso volver atrás (spec 0011, RF-018) es simplemente no
# encender este perfil: el archivo de siempre sigue apuntando al computador de la
# tienda y no se tocó ni una línea.
#
# Aquí no hay ningún secreto escrito. Todos entran por variables de entorno, que es
# lo único que no queda guardado en el repositorio ni dentro de la imagen.

# ── El puerto lo manda el proveedor ──────────────────────────────────────────
# La nube dice en qué puerto escuchar con la variable PORT; no se elige.
server.port=${PORT:8080}

# ── La base, que ya no está en este computador ───────────────────────────────
# RDMOTORS_BD_URL va completa, con jdbc: adelante y con sslmode=require al final:
#   jdbc:postgresql://el-host/rdmotors?sslmode=require
spring.datasource.url=${RDMOTORS_BD_URL}
spring.datasource.username=${RDMOTORS_BD_USUARIO}
spring.datasource.password=${RDMOTORS_BD_CONTRASENA}

# Las bases del plan gratis limitan cuántas conexiones aceptan, y este servidor se
# puede prender y apagar varias veces al día: pedir pocas y soltarlas.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# ── La clave que firma las sesiones: obligatoria ─────────────────────────────
# En el computador del almacén, si falta, el sistema se inventa una y la guarda en
# un archivo. Aquí ese archivo se borra en cada reinicio —y en el plan gratis hay
# varios al día—, así que cada reinicio inventaría otra y SACARÍA A TODO EL MUNDO.
# Se genera UNA VEZ y no se cambia nunca más:  openssl rand -base64 32
rdmotors.seguridad.clave-obligatoria=true
rdmotors.seguridad.clave-token=${RDMOTORS_CLAVE_SESIONES:}

# ── La cookie de la sesión, solo por HTTPS ───────────────────────────────────
# En el almacén va apagado porque la tablet entra por http://192.168.x.x. Por
# internet es al revés: una cookie de sesión sin HTTPS se puede robar en el camino.
rdmotors.seguridad.cookie-segura=true

# ── El reloj, que aquí está afuera ───────────────────────────────────────────
# Un servidor que se apaga no cuenta las horas: a las 2 de la mañana no hay nadie
# adentro. Un servicio gratuito de llamadas programadas toca /api/tareas/... con
# esta llave en el encabezado X-RDMOTORS-LLAVE. Sin llave configurada, esas
# direcciones quedan muertas — que es lo correcto en el computador del almacén,
# donde el reloj sí está adentro.
rdmotors.tareas.llave=${RDMOTORS_LLAVE_TAREAS:}

# ── El programa que saca la copia ────────────────────────────────────────────
# En Windows es una ruta completa; dentro del contenedor está en el camino y se
# llama por su nombre. Sin esta línea, bajar el respaldo falla con "no such file"
# — y se descubre el día que hace falta la copia.
rdmotors.respaldo.pg-dump=pg_dump

# ── Docker Compose: apagado ──────────────────────────────────────────────────
# En desarrollo, la aplicación levanta sola el contenedor de Postgres al arrancar
# (application.properties). En la nube no hay Docker ni existe ese archivo: sin
# esta línea, el servidor no arranca y el error habla de un archivo que no está.
# Es la primera cosa que falla al desplegar si se olvida.
spring.docker.compose.enabled=false
